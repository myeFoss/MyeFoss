name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > myefoss-release.jks

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_FILE: ../myefoss-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MyeFoss.apk
          cp app/build/outputs/apk/debug/app-debug.apk MyeFoss-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyeFoss-debug
          path: MyeFoss-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyeFoss
          path: MyeFoss.apk

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep "versionName" app/build.gradle | head -1 | awk -F '"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: MyeFoss v${{ steps.get_version.outputs.VERSION }}
          files: |
            MyeFoss.apk
            MyeFoss-debug.apk
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, '-rc') }}
          generate_release_notes: true

